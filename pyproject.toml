[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishguard-ai"
version = "3.0.0"
description = "Real-time phishing and social engineering detection CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "dnspython",
    "tldextract",
]

[project.scripts]
phishguard = "phishguard.cli.main:main"

[tool.setuptools.packages.find]
include = ["phishguard*"]
